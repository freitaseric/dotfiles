general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor = eDP-1
    path = /home/freitaseric/Pictures/Wallpapers/main.png

    blur_passes = 0
    brightness = 0.58
}

label {
    monitor = eDP-1

    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 54
    font_family = Inter

    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor = eDP-1

    text = cmd[update:60000] date "+%A, %d de %B"
    color = rgba(230, 233, 237, 0.85)
    font_size = 14
    font_family = Inter

    position = 0, 112
    halign = center
    valign = center
}

input-field {
    monitor = eDP-1

    size = 280, 44
    outline_thickness = 2

    outer_color = rgba(15, 118, 110, 1.0)
    inner_color = rgba(24, 27, 30, 0.88)
    font_color = rgba(255, 255, 255, 1.0)

    check_color = rgba(94, 234, 212, 1.0)
    fail_color = rgba(239, 68, 68, 1.0)

    font_family = Inter

    fade_on_empty = false
    placeholder_text = <span foreground="##929aa3">Digite sua senha</span>

    dots_size = 0.20
    dots_spacing = 0.20

    rounding = 6

    position = 0, -130
    halign = center
    valign = center
}
